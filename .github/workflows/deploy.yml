# GitHub Pages deploy — FREE hosting straight from your repo.
# How it works:
#   1. Push this repo to GitHub (any name, e.g. portfolio).
#   2. Repo → Settings → Pages → "Build and deployment" → Source: **GitHub Actions**.
#   3. That's it. Every push to `main` builds a static export and publishes it
#      to https://<username>.github.io/<repo-name>/
# Notes:
#   • The contact form falls back to mailto: on Pages (no server) — nothing breaks.
#   • For real email sending use Vercel instead (see README).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Static export build
        run: npm run build
        env:
          NEXT_OUTPUT: export
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
